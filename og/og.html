<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>天空之鏡 — 分享卡</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b0d0f;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top,
        rgba(6, 8, 10, .95) 0%,
        rgba(6, 8, 10, .82) 24%,
        rgba(6, 8, 10, .42) 48%,
        rgba(6, 8, 10, .06) 72%,
        rgba(6, 8, 10, 0) 84%);
  }

  .copy {
    position: absolute;
    left: 64px;
    right: 120px;
    bottom: 62px;
    z-index: 2;
    display: flex;
    gap: 22px;
  }

  .bar {
    flex: 0 0 5px;
    border-radius: 3px;
    background: #6fe3c4;
    margin-top: 6px;
    margin-bottom: 4px;
  }

  .text {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: #f2f5f7;
  }

  h1 {
    margin: 0;
    font-size: 74px;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.06;
    text-shadow: 0 2px 24px rgba(0, 0, 0, .45);
  }

  p.tagline {
    margin: 16px 0 0;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.35;
    color: #d5dee5;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .5);
  }

  p.meta {
    margin: 22px 0 0;
    font-size: 19px;
    line-height: 1.4;
    color: #b3bfc9;
    letter-spacing: .02em;
    text-shadow: 0 1px 14px rgba(0, 0, 0, .6);
  }

  p.meta span { color: #6fe3c4; }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/sample-after.webp" alt="">
    <div class="copy">
      <div class="bar"></div>
      <div class="text">
        <h1>天空之鏡</h1>
        <p class="tagline">把風景照變成水面倒影</p>
        <p class="meta"><span>免費</span>　照片不上傳　瀏覽器內完成</p>
      </div>
    </div>
  </div>
</body>
</html>
